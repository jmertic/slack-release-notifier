name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-and-analyze:
    name: Build, Test & SonarScan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: '.python-version'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install poetry==2.1.1

      - name: Install dependencies
        run: poetry install --frozen --no-interaction

      - name: Run Unittest with Coverage
        run: |
          poetry run coverage run -m unittest discover -s tests
          poetry run coverage xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@cb4da1bc37b85e0546cb5b85a1ef4cddb2b8e398 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
