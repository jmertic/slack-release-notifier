name: 'Slack Release Notifier'
description: 'Posts GitHub releases to Slack channels'
author: 'John Mertic'
branding:
  icon: 'message-square'
  color: 'yellow'

inputs:
  project_name:
    required: false
    description: Project Name
    default: "My Project"
  project_logo:
    required: true
    description: Project logo
  release_version:
    required: false
    description: Release Version
    default: "${{ github.event.release.name }}"
  release_url:
    required: false
    description: Release URL
    default: "${{ github.event.release.html_url }}"
  release_notes:
    required: false
    description: Release Notes
    default: "${{ github.event.release.body }}"
  slack_bot_token:
    description: 'Slack Bot User OAuth Token (xoxb-...)'
    required: true
  slack_channel:
    description: 'Slack channel ID or name to post to'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install poetry
      uses: abatilo/actions-poetry@3765cf608f2d4a72178a9fc5b918668e542b89b1 # v4.0.0

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: '${{ github.action_path }}/.python-version'

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: poetry install --no-root --only main --no-interaction --no-ansi

    - name: Run Notifier Script
      shell: bash
      working-directory: ${{ github.action_path }}
      run: >
        poetry run python main.py
        --slack-bot-token "${{ inputs.slack_bot_token }}"
        --slack-channel "${{ inputs.slack_channel }}"
        --project-name "${{ inputs.project_name }}"
        --project-logo "${{ inputs.project_logo }}"
        --release-version "${{ inputs.release_version }}"
        --release-url "${{ inputs.release_url }}"
        --release-notes "${{ inputs.release_notes }}"
